[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
windows = "0.62.2"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# The model checks in cargo test walk a few hundred thousand states; optimized, they finish in seconds. Debug
# assertions and overflow checks stay on.
[profile.test]
opt-level = 3

# Keep Windows' speed optimization; the C boundary favors size. LTO also removes
# Rust library code the native shells never call.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.ticker-ffi]
opt-level = "s"
