[workspace]
resolver = "3"
members = ["core", "paint"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
ticker-core = { path = "core" }
ticker-paint = { path = "paint" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
fontdue = { version = "0.9", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# The model check serializes every state it visits, once per mutant too.
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.ticker-core]
opt-level = 2
