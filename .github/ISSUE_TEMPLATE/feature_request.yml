name: Feature request
description: Suggest a change or a new feature.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The problem you have today, or what you want the ticker to do.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: Optional. How you would like it to work.
  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms
      options:
        - label: Windows
        - label: macOS
